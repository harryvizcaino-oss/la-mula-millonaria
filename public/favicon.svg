<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Gradientes para efecto 3D -->
    <linearGradient id="truckBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FBBF24;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#F59E0B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D97706;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="truckCab" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FDE68A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FBBF24;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="wheel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1F2937;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#111827;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="wheelHub" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FBBF24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D97706;stop-opacity:1" />
    </radialGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Fondo redondeado -->
  <rect width="64" height="64" rx="14" fill="#FFFBEB"/>

  <!-- Sombra del camión -->
  <ellipse cx="32" cy="50" rx="22" ry="4" fill="#000000" opacity="0.15"/>

  <!-- Carrocería del camión (parte trasera) -->
  <rect x="12" y="26" width="28" height="18" rx="3" fill="url(#truckBody)" filter="url(#shadow)"/>

  <!-- Cabina del camión (parte delantera) -->
  <path d="M 40 26 L 48 26 L 52 32 L 52 44 L 40 44 Z" fill="url(#truckCab)" filter="url(#shadow)"/>

  <!-- Ventana de la cabina -->
  <path d="M 42 28 L 47 28 L 50 32 L 42 32 Z" fill="#60A5FA" opacity="0.8"/>

  <!-- Rueda trasera -->
  <circle cx="20" cy="46" r="6" fill="url(#wheel)" filter="url(#shadow)"/>
  <circle cx="20" cy="46" r="3" fill="url(#wheelHub)"/>

  <!-- Rueda delantera -->
  <circle cx="44" cy="46" r="6" fill="url(#wheel)" filter="url(#shadow)"/>
  <circle cx="44" cy="46" r="3" fill="url(#wheelHub)"/>

  <!-- Detalles decorativos -->
  <rect x="14" y="28" width="6" height="2" rx="1" fill="#FDE68A" opacity="0.6"/>
  <rect x="14" y="32" width="6" height="2" rx="1" fill="#FDE68A" opacity="0.6"/>
  <rect x="14" y="36" width="6" height="2" rx="1" fill="#FDE68A" opacity="0.6"/>

  <!-- Luz delantera -->
  <circle cx="51" cy="38" r="1.5" fill="#FEF3C7"/>

  <!-- Estela de velocidad (idle game style) -->
  <path d="M 8 32 Q 4 32 4 36 Q 4 40 8 40" stroke="#FBBF24" stroke-width="2" fill="none" opacity="0.5" stroke-linecap="round"/>
  <path d="M 6 30 Q 2 30 2 34 Q 2 38 6 38" stroke="#FBBF24" stroke-width="1.5" fill="none" opacity="0.3" stroke-linecap="round"/>

  <!-- Estrella dorada (idle game style) -->
  <path d="M 52 12 L 53.5 15.5 L 57 16 L 54.5 18.5 L 55 22 L 52 20.5 L 49 22 L 49.5 18.5 L 47 16 L 50.5 15.5 Z" fill="#FBBF24" filter="url(#shadow)"/>
</svg>
